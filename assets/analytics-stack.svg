<svg width="1000" height="210" viewBox="0 0 1000 210"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="1000" height="210" fill="#0D1117"/>

  <!-- POWER BI CARD -->
  <rect x="20" y="10"
        width="460" height="190"
        rx="18"
        fill="#0D1117"
        stroke="#F2C811"
        stroke-width="2"/>

  <!-- Power BI icon -->
  <circle cx="105" cy="105" r="52"
          fill="#111820"
          stroke="#F2C811"
          stroke-opacity="0.35"
          stroke-width="2"/>

  <rect x="78" y="118" width="11" height="25"
        rx="3" fill="#F2C811"/>
  <rect x="94" y="105" width="11" height="38"
        rx="3" fill="#F2C811"/>
  <rect x="110" y="90" width="11" height="53"
        rx="3" fill="#F2C811"/>

  <!-- Power BI title -->
  <text x="170" y="82"
        font-family="Arial, Helvetica, sans-serif"
        font-size="30"
        font-weight="700"
        fill="#F2C811">
    Power BI
  </text>

  <!-- Statistics -->
  <rect x="170" y="102"
        width="195" height="42"
        rx="8"
        fill="none"
        stroke="#F2C811"
        stroke-width="2"/>

  <text x="267" y="130"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="700"
        letter-spacing="2"
        fill="#F2C811">
    STATISTICS
  </text>

  <!-- Divider -->
  <line x1="390" y1="45"
        x2="390" y2="165"
        stroke="#30363D"
        stroke-width="2"/>

  <!-- Power BI number -->
  <text x="435" y="100"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="700"
        fill="#F2C811">
    8
  </text>

  <text x="435" y="128"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#E6EDF3">
    Repositories
  </text>


  <!-- EXCEL CARD -->
  <rect x="520" y="10"
        width="460" height="190"
        rx="18"
        fill="#0D1117"
        stroke="#21A366"
        stroke-width="2"/>

  <!-- Excel icon -->
  <circle cx="605" cy="105" r="52"
          fill="#111820"
          stroke="#21A366"
          stroke-opacity="0.35"
          stroke-width="2"/>

  <rect x="580" y="78"
        width="50"
        height="55"
        rx="5"
        fill="#21A366"/>

  <text x="605" y="117"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="700"
        fill="white">
    X
  </text>

  <!-- Excel title -->
  <text x="670" y="82"
        font-family="Arial, Helvetica, sans-serif"
        font-size="30"
        font-weight="700"
        fill="#21A366">
    Excel
  </text>

  <!-- Statistics -->
  <rect x="670" y="102"
        width="195" height="42"
        rx="8"
        fill="none"
        stroke="#21A366"
        stroke-width="2"/>

  <text x="767" y="130"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="700"
        letter-spacing="2"
        fill="#21A366">
    STATISTICS
  </text>

  <!-- Divider -->
  <line x1="890" y1="45"
        x2="890" y2="165"
        stroke="#30363D"
        stroke-width="2"/>

  <!-- Excel number -->
  <text x="935" y="100"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="700"
        fill="#21A366">
    6
  </text>

  <text x="935" y="128"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#E6EDF3">
    Repositories
  </text>

</svg>
